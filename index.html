<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NILLU Café | Coming Soon</title>
  <meta name="description" content="NILLU Café, HSR Layout, Bengaluru. ನಿಲ್ಲು — Kannada for 'stop'. A small room with good light, and a reason to slow down. Opening soon.">
  <meta name="theme-color" content="#FFFFFF">

  <meta property="og:type" content="website">
  <meta property="og:title" content="NILLU Café | Coming Soon">
  <meta property="og:description" content="ನಿಲ್ಲು — Kannada for 'stop'. A small room with good light, and a reason to slow down. HSR Layout, Bengaluru.">
  <meta property="og:url" content="https://nillu.cafe/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23FFFFFF'/><text x='50' y='74' font-size='66' font-family='Georgia,serif' fill='%230A0A0A' text-anchor='middle'>N</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&family=Noto+Serif+Kannada:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink:       #0A0A0A;
      --ink-soft:  #5C5C5C;
      --ink-faint: #9A9A9A;
      --line:      #E2E2E2;
      --edge:      6vw;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      height: 100svh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #FFFFFF;
      color: var(--ink);
      font-family: "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .micro {
      font-size: clamp(8px, 1.2vh, 10px);
      font-weight: 400;
      letter-spacing: .3em;
      text-indent: .3em;
      text-transform: uppercase;
      color: var(--ink-faint);
      white-space: nowrap;
    }

    /* ---------- corners ---------- */
    header,
    footer {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 14px;
      padding: clamp(20px, 3.6vh, 42px) var(--edge);
    }

    .wordmark {
      display: flex;
      align-items: baseline;
      gap: .6em;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(17px, 2.7vh, 24px);
      font-weight: 400;
      letter-spacing: .34em;
      text-indent: .34em;
      color: var(--ink);
    }

    .wordmark small {
      font-family: "Jost", sans-serif;
      font-size: .42em;
      font-weight: 400;
      letter-spacing: .26em;
      text-indent: .26em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    /* ---------- hero ---------- */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 var(--edge);
      min-height: 0;
    }

    .hero {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: .1em;
      font-size: clamp(50px, min(21vw, 29vh), 240px);
      font-weight: 400;
      line-height: 1.45;
      white-space: nowrap;
      /* reserve the line box so nothing jumps while typing */
      min-height: 1.5em;
    }

    /* script-specific faces — swapped while the line is empty */
    .hero[data-script="kn"] .hero-name,
    .hero[data-script="kn"] .hero-sub { font-family: "Noto Serif Kannada", serif; }

    .hero[data-script="en"] .hero-name,
    .hero[data-script="en"] .hero-sub { font-family: "Cormorant Garamond", Georgia, serif; }

    .hero[data-script="en"] .hero-name { letter-spacing: .06em; text-indent: .06em; }

    .hero-sub {
      font-size: .155em;
      font-weight: 300;
      letter-spacing: .05em;
      color: var(--ink-soft);
      line-height: 1;
    }

    .caret {
      align-self: center;
      width: .03em;
      height: .6em;
      background: var(--ink);
      margin-left: .06em;
      animation: blink 1.05s steps(1, end) infinite;
    }

    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .rule {
      width: clamp(28px, 4vw, 54px);
      height: 1px;
      background: var(--line);
      margin: clamp(12px, 2.4vh, 28px) 0 clamp(12px, 2.2vh, 24px);
    }

    .caption {
      font-size: clamp(8px, 1.25vh, 10px);
      font-weight: 400;
      letter-spacing: .42em;
      text-indent: .42em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .line {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(14px, 2.2vh, 20px);
      line-height: 1.6;
      color: var(--ink-soft);
      max-width: 30ch;
      margin-top: clamp(10px, 1.8vh, 18px);
      text-wrap: balance;
    }

    .status {
      font-size: clamp(9px, 1.35vh, 11px);
      font-weight: 400;
      letter-spacing: .46em;
      text-indent: .46em;
      text-transform: uppercase;
      color: var(--ink);
      margin-top: clamp(16px, 3.2vh, 36px);
    }

    /* ---------- entrance ---------- */
    .reveal {
      opacity: 0;
      animation: fade 1.1s cubic-bezier(.22, 1, .36, 1) forwards;
    }

    .d1 { animation-delay: .1s; }
    .d2 { animation-delay: .25s; }
    .d3 { animation-delay: .5s; }
    .d4 { animation-delay: .68s; }
    .d5 { animation-delay: .84s; }

    @keyframes fade {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; opacity: 1; }
      .caret  { display: none; }
    }

    /* ---------- narrow ---------- */
    @media (max-width: 560px) {
      :root { --edge: 7vw; }

      header,
      footer {
        flex-direction: column;
        align-items: center;
        gap: 7px;
        text-align: center;
      }

      .micro   { letter-spacing: .24em; text-indent: .24em; }
      .caption { letter-spacing: .3em;  text-indent: .3em;  }
    }

    /* ---------- short viewports ---------- */
    @media (max-height: 560px) { .line { display: none; } }
    @media (max-height: 420px) { body { height: auto; min-height: 100svh; overflow: auto; } }
  </style>
</head>

<body>
  <header>
    <span class="wordmark reveal d1">NILLU<small>Café</small></span>
    <span class="micro reveal d1">HSR Layout · Bengaluru</span>
  </header>

  <main>
    <!-- Kannada is the no-JS default; the script clears and types it -->
    <h1 class="hero reveal d2" data-script="kn">
      <span class="hero-name" lang="kn">ನಿಲ್ಲು</span><span class="hero-sub" lang="kn">ಕೆಫೆ</span>
    </h1>

    <span class="rule reveal d3" aria-hidden="true"></span>

    <p class="caption reveal d3">Kannada for “stop”</p>

    <p class="line reveal d4">
      A small room with good light,
      and a reason to slow down.
    </p>

    <p class="status reveal d5">Coming Soon</p>
  </main>

  <footer>
    <span class="micro reveal d5">Made with love in Bengaluru</span>
    <span class="micro reveal d5">© 2026 Nillu Café</span>
  </footer>

  <script>
    (function () {
      var hero = document.querySelector('.hero');
      var name = hero.querySelector('.hero-name');
      var sub  = hero.querySelector('.hero-sub');

      var WORDS = [
        { script: 'kn', lang: 'kn', name: 'ನಿಲ್ಲು',  sub: 'ಕೆಫೆ' },
        { script: 'en', lang: 'en', name: 'NILLU',   sub: 'Café' }
      ];

      // Kannada clusters (ನಿ, ಲ್ಲು) must be typed whole, never split mid-conjunct
      var split = (function () {
        if (typeof Intl !== 'undefined' && Intl.Segmenter) {
          var seg = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
          return function (s) {
            return Array.from(seg.segment(s), function (g) { return g.segment; });
          };
        }
        return function (s) { return Array.from(s); };
      })();

      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return; // leave the static Kannada lockup in place
      }

      var caret = document.createElement('span');
      caret.className = 'caret';
      caret.setAttribute('aria-hidden', 'true');
      hero.appendChild(caret);

      var TYPE = 125, ERASE = 55, HOLD = 2800, GAP = 420;
      var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

      async function write(el, text) {
        var parts = split(text);
        for (var i = 0; i < parts.length; i++) {
          el.textContent += parts[i];
          await sleep(TYPE);
        }
      }

      async function erase(el) {
        var parts = split(el.textContent);
        while (parts.length) {
          parts.pop();
          el.textContent = parts.join('');
          await sleep(ERASE);
        }
      }

      async function run() {
        name.textContent = '';
        sub.textContent = '';
        await sleep(900); // let the entrance fade settle

        for (var i = 0; ; i = (i + 1) % WORDS.length) {
          var w = WORDS[i];
          hero.dataset.script = w.script;
          name.lang = w.lang;
          sub.lang = w.lang;

          await write(name, w.name);
          await write(sub, w.sub);
          await sleep(HOLD);
          await erase(sub);
          await erase(name);
          await sleep(GAP);
        }
      }

      run();
    })();
  </script>
</body>
</html>
